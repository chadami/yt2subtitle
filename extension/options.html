<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VidLingo</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17191f;
        --muted: #7b8290;
        --line: rgba(23, 25, 31, 0.09);
        --card: rgba(255, 255, 255, 0.92);
        --accent: #2f5cf6;
        --ok: #1a9d5a;
        --warn: #c07514;
        --bg: #f7f8fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f2f4f8;
          --muted: #9aa1ad;
          --line: rgba(255, 255, 255, 0.12);
          --card: rgba(28, 30, 36, 0.9);
          --bg: #121318;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        justify-content: center;
        padding: 48px 24px;
      }
      main { width: 100%; max-width: 520px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .logo { width: 44px; height: 44px; border-radius: 10px; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
      .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(15, 20, 40, 0.06);
      }
      .status { display: flex; align-items: flex-start; gap: 12px; }
      .dot {
        width: 9px; height: 9px; border-radius: 50%; margin-top: 6px;
        background: var(--muted); flex: none;
      }
      .card[data-state="connected"] .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(26, 157, 90, 0.14); }
      .card[data-state="error"] .dot { background: var(--warn); box-shadow: 0 0 0 4px rgba(192, 117, 20, 0.14); }
      .card[data-state="connecting"] .dot { background: var(--accent); animation: pulse 1s infinite ease-in-out; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .title { font-size: 15.5px; font-weight: 650; }
      .detail { margin-top: 3px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
      .address {
        margin-top: 14px;
        padding: 9px 11px;
        border-radius: 9px;
        background: rgba(47, 92, 246, 0.07);
        color: var(--accent);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      button {
        margin-top: 16px;
        width: 100%;
        height: 40px;
        border-radius: 10px;
        border: 0;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button.primary { background: var(--accent); color: #fff; }
      button.primary:hover { filter: brightness(1.06); }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .hint { margin-top: 22px; }
      .hint h2 { margin: 0 0 6px; font-size: 13px; font-weight: 650; }
      .hint p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
      .advanced { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
      summary { color: var(--muted); font-size: 12.5px; cursor: pointer; }
      .advanced input {
        margin-top: 10px;
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .advanced button { height: 34px; margin-top: 10px; }
      #message { min-height: 16px; margin: 8px 0 0; color: var(--muted); font-size: 12px; }
      footer { margin-top: 28px; color: var(--muted); font-size: 11.5px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon-128.png" alt="" />
        <div>
          <h1>VidLingo</h1>
          <p class="sub" data-i18n="subtitle">AI subtitles for YouTube</p>
        </div>
      </header>

      <section class="card" id="card" data-state="disconnected">
        <div class="status">
          <span class="dot"></span>
          <div>
            <div class="title" id="statusTitle">未连接</div>
            <div class="detail" id="statusDetail">
              打开 macOS 版 VidLingo，然后点下面的按钮。
            </div>
          </div>
        </div>
        <div class="address" id="address" hidden></div>
        <button class="primary" id="connect">连接本机应用</button>
        <button class="secondary" id="reconnect" hidden>重新连接</button>
      </section>

      <section class="hint">
        <h2 data-i18n="moreTitle">更多设置</h2>
        <p data-i18n="moreBody">
          字幕语言、原文字幕、翻译历史都在 macOS 应用的「字幕输出」和「历史记录」里。
        </p>
      </section>

      <details class="advanced">
        <summary data-i18n="advanced">手动设置地址</summary>
        <input id="apiBase" placeholder="http://127.0.0.1:3000" spellcheck="false" />
        <button class="secondary" id="saveBase" data-i18n="save">保存并连接</button>
        <p id="message"></p>
      </details>

      <footer>VidLingo · <span id="version">—</span></footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
