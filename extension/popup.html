<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; --ink:#191919; --muted:#737373; --line:#e8e8e8; --surface:#f7f7f7; }
      * { box-sizing: border-box; }
      body { width: 320px; margin: 0; background:#fff; color:var(--ink); font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
      main { padding: 18px; }
      header { display:flex; align-items:center; gap:11px; padding-bottom:16px; border-bottom:1px solid var(--line); }
      .logo { width:36px; height:36px; border-radius:8px; }
      h1 { margin:0; font-size:15px; font-weight:650; }
      .subtitle { margin:2px 0 0; color:var(--muted); font-size:12px; }
      .account { display:flex; align-items:center; gap:10px; margin:15px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
      .dot { width:9px; height:9px; border-radius:50%; background:#aaa; box-shadow:0 0 0 4px rgba(0,0,0,.04); }
      .account[data-state="active"] .dot { background:#22a06b; }
      .account-copy { flex:1; min-width:0; }
      .account-state { font-weight:600; }
      .account-email { margin-top:2px; overflow:hidden; color:var(--muted); text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
      button { width:100%; height:38px; border:1px solid #d9d9d9; border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; font:600 13px/1 inherit; }
      button:hover { background:#f5f5f5; border-color:#c9c9c9; }
      .hint { margin:12px 2px 0; color:var(--muted); font-size:12px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon-48.png" alt="" />
        <div><h1>VidLingo</h1><p class="subtitle">播放器内字幕翻译</p></div>
      </header>
      <section id="account" class="account" data-state="checking">
        <span class="dot"></span>
        <div class="account-copy"><div id="accountState" class="account-state">正在检查账号…</div><div id="accountEmail" class="account-email"></div></div>
      </section>
      <button id="openOptions" type="button">打开设置</button>
      <p class="hint">字幕开启、自动翻译和字幕样式已移到 YouTube 播放器控制栏。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
