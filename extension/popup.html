<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; --ink: #202024; --muted: #626269; --line: #e4e4e7; --bg: #fff; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { width: 360px; margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; }
      main { display: flex; flex-direction: column; gap: 20px; padding: 20px; }
      .status { display: flex; gap: 12px; align-items: center; }
      .status-icon { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 50%; background: #fff0e8; }
      .status-icon.ok { background: #edf7f0; }
      .status-icon img { width: 19px; height: 19px; }
      .status-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .state { font-size: 14px; font-weight: 600; line-height: 1.4; }
      .detail { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .engine { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 10px; background: #f6f6f7; }
      .engine-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .engine-label { color: var(--muted); font-size: 12px; font-weight: 500; line-height: 1.5; }
      .provider { max-width: 150px; overflow-wrap: anywhere; padding: 3px 8px; border-radius: 5px; background: #fff0e8; color: #a3411b; font-size: 12px; font-weight: 500; line-height: 1.4; }
      .model { overflow-wrap: anywhere; font-size: 13px; font-weight: 500; line-height: 1.6; }
      .connection { display: flex; flex-direction: column; gap: 14px; }
      .connection p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px; background: linear-gradient(180deg, #ff925f 0%, #ff7f49 48%, #f16d35 100%); box-shadow: inset 0 1px 1px #ffffff40, inset 0 -1px 1px #a13d1826, 0 2px 5px #a4472026; color: #fff; font: 600 13px/1.4 "PingFang SC", -apple-system, sans-serif; cursor: pointer; }
      button img { width: 16px; height: 16px; }
      button:hover { filter: brightness(1.04); }
      button:focus-visible { outline: 2px solid #a3411b; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .7; }
      footer { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
      footer img { width: 18px; height: 18px; flex: none; }
      footer p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <section class="status" role="status" aria-live="polite">
        <span class="status-icon" id="dot"><img id="statusIcon" src="icons/popup-plugs.svg" alt="" /></span>
        <div class="status-copy"><div class="state" id="state">检查中…</div><div class="detail" id="detail">正在连接本机应用</div></div>
      </section>
      <section class="engine" id="engine" hidden>
        <div class="engine-head"><span class="engine-label" id="engineLabel">当前 AI 引擎</span><span class="provider" id="provider"></span></div>
        <div class="model" id="model"></div>
      </section>
      <section class="connection" id="connection" hidden>
        <p id="connectionHint">打开 Mac 上的 VidLingo，并保持应用运行。</p>
        <button id="connect" type="button"><img src="icons/popup-link.svg" alt="" /><span id="connectLabel">连接本机应用</span></button>
      </section>
    </main>
    <footer><img src="icons/popup-captions.svg" alt="" /><p id="hint">字幕显示与样式，<br />请在 YouTube 播放器里调整。</p></footer>
    <script src="popup.js"></script>
  </body>
</html>
