<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17191f;
        --muted: #8a90a0;
        --line: rgba(23, 25, 31, 0.1);
        --bg: #fff;
        --ok: #1a9d5a;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #f2f4f8; --muted: #9aa1ad; --line: rgba(255,255,255,.12); --bg: #16181d; }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      main { padding: 20px; }
      .brand { display: flex; align-items: center; gap: 9px; }
      .brand img { width: 28px; height: 28px; border-radius: 7px; }
      h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
      .status { display: flex; gap: 9px; align-items: flex-start; margin-top: 22px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #b6bac4; margin-top: 5px; flex: none; }
      .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(26,157,90,.15); }
      .state { font-size: 13.5px; font-weight: 650; }
      .detail { margin-top: 2px; color: var(--muted); font-size: 11.5px; line-height: 1.45; }
      button {
        width: 100%; height: 38px; margin-top: 20px;
        border: 0; border-radius: 9px;
        background: var(--ink); color: var(--bg);
        font: 600 13px/1 inherit; cursor: pointer;
      }
      button:hover { opacity: 0.9; }
      .hint { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/icon-32.png" alt="" />
        <h1>VidLingo</h1>
      </div>
      <section class="status">
        <span class="dot" id="dot"></span>
        <div>
          <div class="state" id="state">检查中…</div>
          <div class="detail" id="detail"></div>
        </div>
      </section>
      <button id="openOptions" type="button">打开设置</button>
      <p class="hint">字幕显示与样式在 YouTube 播放器里调整</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
