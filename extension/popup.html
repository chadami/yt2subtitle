<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        --ink: #17191f;
        --muted: #9298a5;
        --button-hover: #292c33;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        min-height: 310px;
        margin: 0;
        background: #fff;
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        display: flex;
        min-height: 310px;
        flex-direction: column;
        padding: 20px 24px;
      }
      h1 {
        margin: 0;
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -1px;
        line-height: 1.18;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-logo {
        width: 32px;
        height: 32px;
        border-radius: 7px;
        display: block;
        flex: 0 0 32px;
      }
      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
      }
      .account {
        min-width: 0;
        margin-top: 34px;
      }
      .account-state {
        color: var(--muted);
        font-size: 15px;
        font-weight: 500;
        line-height: 1.3;
      }
      .account-email {
        margin-top: 5px;
        overflow: hidden;
        color: var(--ink);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        width: 100%;
        height: 42px;
        margin-top: auto;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        cursor: pointer;
        font: 650 16px/1 "Avenir Next", Avenir, "SF Pro Display", -apple-system,
          BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: background-color 160ms ease, transform 160ms ease;
      }
      button:hover { background: var(--button-hover); }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid rgba(23, 25, 31, 0.2); outline-offset: 3px; }
      .hint {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img class="brand-logo" src="icons/icon-32.png" alt="" />
          <h1>VidLingo</h1>
        </div>
        <p id="popupSubtitle" class="subtitle">AI translation for YouTube subtitles</p>
      </header>
      <section id="account" class="account" data-state="checking">
        <div id="accountState" class="account-state">Current account</div>
        <div id="accountEmail" class="account-email">Checking account…</div>
      </section>
      <button id="openOptions" type="button">Open settings</button>
      <p id="popupHint" class="hint">Subtitle display, auto-translation, and subtitle style are available in the YouTube player controls.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
