<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>字幕业务控制台</title><link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div id="login" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">CC</div><p class="eyebrow">CAPTION CONTROL</p>
      <h1>字幕业务控制台</h1><p class="muted">用户、翻译任务与公共字幕的统一运营入口。</p>
      <form id="loginForm"><label>管理员邮箱<input id="email" type="email" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">进入控制台 <span>→</span></button><p id="loginError" class="error"></p></form>
    </section><aside class="login-aside"><div><b>LIVE OPERATIONS</b><h2>看清每一次翻译，<br>处理真正需要处理的事。</h2></div><p>后台仅供授权人员访问 · 登录状态保留 12 小时</p></aside>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar"><div class="logo"><span>CC</span><div>Caption<br>Control</div></div>
      <nav id="nav"><button data-page="dashboard" class="active">总览</button><button data-page="users">用户与会员</button><button data-page="jobs">翻译任务</button><button data-page="subtitles">字幕结果</button><button data-page="videos">视频库</button></nav>
      <div class="sidebar-foot"><span class="live-dot"></span>服务数据实时读取<button id="logout">退出登录</button></div>
    </aside>
    <main><header><div><p class="eyebrow" id="sectionEyebrow">OPERATIONS OVERVIEW</p><h1 id="title">业务总览</h1></div><div class="header-right"><span id="now"></span><button id="refresh" class="icon-button" title="刷新">↻</button></div></header>
      <section id="content"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close">×</button><div id="modalContent"></div></div></div>
  <div id="toast" class="toast"></div><script src="/admin/assets/admin.js"></script>
</body></html>
